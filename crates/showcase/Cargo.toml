[package]
name = "showcase"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Interactive showcase of all subwayrat TUI widgets"

[[bin]]
name = "showcase"
path = "src/main.rs"

[dependencies]
ratatui = { workspace = true }
crossterm = "0.28"
rat-chrome = { version = "0.1.0", path = "../rat-chrome" }
rat-spinner = { version = "0.1.0", path = "../rat-spinner" }
rat-widgets = { version = "0.1.0", path = "../rat-widgets" }
rat-editor = { version = "0.1.0", path = "../rat-editor" }
rat-diff = { version = "0.1.0", path = "../rat-diff" }
rat-table = { version = "0.1.0", path = "../rat-table" }
rat-markdown = { version = "0.1.0", path = "../rat-markdown" }
rat-spreadsheet = { version = "0.1.0", path = "../rat-spreadsheet" }
rat-tree = { version = "0.1.0", path = "../rat-tree" }
rat-keymap = { version = "0.1.0", path = "../rat-keymap" }
rat-scrolltile = { version = "0.1.0", path = "../rat-scrolltile" }
rat-outline = { version = "0.1.0", path = "../rat-outline" }
rat-agenda = { version = "0.1.0", path = "../rat-agenda" }
rat-datepicker = { version = "0.1.0", path = "../rat-datepicker" }
rat-fuzzy = { version = "0.1.0", path = "../rat-fuzzy" }
rat-capture = { version = "0.1.0", path = "../rat-capture" }
rat-backlinks = { version = "0.1.0", path = "../rat-backlinks" }
rat-tags = { version = "0.1.0", path = "../rat-tags" }
rat-typst = { version = "0.1.0", path = "../rat-typst" }
